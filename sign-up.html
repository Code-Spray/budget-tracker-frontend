<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب | Budget Tracker</title>
  <!-- نسخة Bootstrap الخاصة بالـ RTL -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="container py-4">
    <div class="card auth-card shadow-sm mx-auto">
      <div class="card-body p-4">
        <h1 class="h3 text-center mb-1"> Budget Tracker</h1>
        <p class="text-center text-muted mb-4">إنشاء حساب جديد</p>

        <!-- novalidate عشان احنا بنعمل الـ validation بنفسنا في JS -->
        <form id="signup-form" novalidate>
          <div class="mb-3">
            <label for="nickname" class="form-label">الاسم المستعار</label>
            <input type="text" class="form-control" id="nickname" name="nickname" autocomplete="nickname">
            <div class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">اسم المستخدم</label>
            <input type="text" class="form-control" id="username" name="username" dir="ltr" autocomplete="username">
            <div class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" id="email" name="email" dir="ltr" autocomplete="email">
            <div class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">كلمة المرور</label>
            <input type="password" class="form-control" id="password" name="password" dir="ltr" autocomplete="new-password">
            <div class="form-text">4 حروف على الأقل ويحتوي على رقم واحد على الأقل</div>
            <div class="invalid-feedback"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="signup-btn">إنشاء الحساب</button>
        </form>

        <p class="text-center mt-3 mb-0">
          عندك حساب؟ <a href="log-in.html">سجّل دخول</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/api.js"></script>
  <script src="js/sign-up.js"></script>
</body>
</html>
