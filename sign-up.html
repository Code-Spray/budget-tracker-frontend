<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/sign-up.css">
</head>

<body>
    <main class="h-100 h-custom">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <form class="sign-up-form p-5 mt-5 rounded" style="background-color: #8fc4b7;">
                        <div class="form-group">
                            <label for="nickname">Nickname</label>
                            <input name="nickname" type="text" class="form-control" id="nickname" minlength="2">
                        </div>
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input name="username" type="text" class="form-control" id="username" minlength="2">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input name="email" type="email" class="form-control" id="email">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input name="password" type="password" class="form-control" id="password">
                        </div>
                        <!-- <div class="form-group form-check">
                            <input type="checkbox" class="form-check-input" id="exampleCheck1">
                            <label class="form-check-label" for="exampleCheck1">Check me out</label>
                        </div> -->
                        <button type="submit" class="btn btn-primary m-auto d-block">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="js/jquery.slim.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/global.js"></script>
    <script src="js/sign-up.js"></script>
</body>

</html>
