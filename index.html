<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة المعاملات | Budget Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">Budget Tracker</span>
      <button type="button" class="btn btn-outline-light btn-sm" id="logout-btn">تسجيل خروج</button>
    </div>
  </nav>

  <main class="container pb-5">

    <!-- ===== كروت الملخص ===== -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="card summary-card h-100">
          <div class="card-body text-center">
            <div class="text-muted">إجمالي الدخل</div>
            <div class="fs-3 fw-bold text-success"><span class="num" id="total-income">0.00</span></div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card summary-card h-100">
          <div class="card-body text-center">
            <div class="text-muted">إجمالي المصروفات</div>
            <div class="fs-3 fw-bold text-danger"><span class="num" id="total-outcome">0.00</span></div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card summary-card h-100">
          <div class="card-body text-center">
            <div class="text-muted">الرصيد</div>
            <div class="fs-3 fw-bold text-success" id="balance-wrap"><span class="num" id="balance">0.00</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== فورم إضافة معاملة ===== -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">إضافة معاملة جديدة</h2>
        <form id="add-form" novalidate>
          <div class="row g-3">
            <div class="col-6 col-md-2">
              <label class="form-label" for="add-type">النوع</label>
              <select class="form-select" id="add-type" name="transaction_type">
                <option value="income">دخل</option>
                <option value="outcome">مصروف</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label" for="add-amount">المبلغ</label>
              <input type="number" class="form-control" id="add-amount" name="amount" step="0.01" min="0" inputmode="decimal">
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label" for="add-source">المصدر / الوصف</label>
              <input type="text" class="form-control" id="add-source" name="source">
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12 col-md-2">
              <label class="form-label" for="add-date">التاريخ (اختياري)</label>
              <input type="date" class="form-control" id="add-date" name="transaction_date">
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12 col-md-2 d-grid align-self-start" style="margin-top: 2rem;">
              <button type="submit" class="btn btn-primary" id="add-btn">إضافة</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== جدول المعاملات ===== -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">المعاملات</h2>

        <!-- الفلتر والبحث -->
        <div class="row g-2 mb-3">
          <div class="col-12 col-md-auto">
            <div class="btn-group w-100" role="group" aria-label="فلتر النوع">
              <input type="radio" class="btn-check" name="filter" id="filter-all" value="all" checked>
              <label class="btn btn-outline-primary" for="filter-all">الكل</label>

              <input type="radio" class="btn-check" name="filter" id="filter-income" value="income">
              <label class="btn btn-outline-primary" for="filter-income">دخل</label>

              <input type="radio" class="btn-check" name="filter" id="filter-outcome" value="outcome">
              <label class="btn btn-outline-primary" for="filter-outcome">مصروفات</label>
            </div>
          </div>
          <div class="col-12 col-md">
            <input type="search" class="form-control" id="search-input" placeholder="ابحث بالمصدر...">
          </div>
        </div>

        <!-- Spinner التحميل -->
        <div id="loading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">جاري التحميل...</span>
          </div>
        </div>

        <!-- حالة الجدول الفاضي -->
        <div id="empty-state" class="text-center text-muted py-5 d-none">
          <p class="mb-0" id="empty-message">مفيش معاملات لسه</p>
        </div>

        <!-- الجدول -->
        <div class="table-responsive d-none" id="table-wrap">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>الرقم</th>
                <th>النوع</th>
                <th>المبلغ</th>
                <th>المصدر</th>
                <th>التاريخ</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="transactions-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== Modal التعديل ===== -->
  <div class="modal fade" id="edit-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header d-flex justify-content-between">
          <h5 class="modal-title">تعديل المعاملة</h5>
          <button type="button" class="btn-close ms-0" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body">
          <form id="edit-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="edit-type">النوع</label>
              <select class="form-select" id="edit-type" name="transaction_type">
                <option value="income">دخل</option>
                <option value="outcome">مصروف</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="edit-amount">المبلغ</label>
              <input type="number" class="form-control" id="edit-amount" name="amount" step="0.01" min="0" inputmode="decimal">
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="edit-source">المصدر / الوصف</label>
              <input type="text" class="form-control" id="edit-source" name="source">
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="edit-date">التاريخ</label>
              <input type="date" class="form-control" id="edit-date" name="transaction_date">
              <div class="invalid-feedback"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <!-- form="edit-form" بيربط الزرار بالفورم رغم إنه برا الفورم -->
          <button type="submit" form="edit-form" class="btn btn-primary" id="edit-save-btn">حفظ التعديلات</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Modal تأكيد الحذف ===== -->
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header d-flex justify-content-between">
          <h5 class="modal-title">تأكيد الحذف</h5>
          <button type="button" class="btn-close ms-0" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
        <div class="modal-body">
          هل أنت متأكد إنك عايز تحذف المعاملة: <strong id="delete-source"></strong>؟
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="button" class="btn btn-danger" id="delete-confirm-btn">حذف</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
